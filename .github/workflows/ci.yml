name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run mid-deploy; superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Integration tests start their own SQL Server container (Testcontainers) on this x64 runner.
      SITELEDGER_TEST_DB: container
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore SiteLedger.slnx

      - name: Build (warnings are errors)
        run: dotnet build SiteLedger.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/SiteLedger.UnitTests --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Integration tests (SQL Server via Testcontainers)
        run: >
          dotnet test tests/SiteLedger.IntegrationTests --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx

      - name: Service-layer coverage
        if: always()
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"Html;MarkdownSummaryGithub" -classfilters:"+SiteLedger.Application.Services.*"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test counts and coverage as annotations
        if: always()
        run: |
          for trx in TestResults/*.trx; do
            python3 -c "import re,sys; c=re.search(r'<Counters [^>]*', open(sys.argv[1]).read()).group(0); g=lambda k: re.search(k+r'=\"(\d+)\"', c).group(1); print(f'::notice title=Tests::{sys.argv[1]}: total {g(\"total\")}, passed {g(\"passed\")}, failed {g(\"failed\")}')" "$trx"
          done
          echo "::notice title=Coverage::Service layer $(grep -m1 -oE 'Line coverage:[^|]*\| *[0-9.]+%' coverage/SummaryGithub.md | tr -d '|*' | tr -s ' ')"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coverage/

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag siteledger-api:ci .

      - name: Smoke test (process starts and answers /health/live)
        run: |
          docker run -d --name api -p 8080:8080 \
            -e ConnectionStrings__Default="Server=unused;Database=unused" \
            -e Jwt__SigningKey="$(openssl rand -base64 48)" \
            siteledger-api:ci
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/health/live
          echo
          docker exec api id -un
          docker rm -f api

  deploy:
    # Only main is deployed, and only after the tests and the Docker check pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://siteledger-hkallem-api-btf6anh0erc4c2g4.canadacentral-01.azurewebsites.net
    env:
      APP_URL: https://siteledger-hkallem-api-btf6anh0erc4c2g4.canadacentral-01.azurewebsites.net
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Framework-dependent and CPU-neutral: the Free F1 plan runs a 32-bit worker.
      - name: Publish
        run: dotnet publish src/SiteLedger.Api --configuration Release --output publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: siteledger-hkallem-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Smoke test (live, database, auth required)
        run: |
          curl --silent --show-error --fail --retry 20 --retry-delay 6 --retry-all-errors "$APP_URL/health/live"
          echo
          # A paused free-tier database can take about a minute to resume.
          curl --silent --show-error --fail --retry 20 --retry-delay 6 --retry-all-errors "$APP_URL/health/ready"
          echo
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$APP_URL/api/v1/projects")
          echo "GET /api/v1/projects without a token: $status"
          test "$status" = 401
